# E2E COPY of ../../params/bstar-priv-addr-schema.conf — the lower-environment feed
# runs the FULL production contract (same names, types, keys, transforms,
# PII tags) against a synthetic source; only schema.version differs. Keep
# the two in step: BstarConfigTest fails if the columns drift.
# bstar PRIV_ADDR schema contract — 24 columns: 21 source data columns + the
# 3 source PARTITION columns. Mirrors ../ddl/curated_ddl.sql (which adds the
# 6 framework audit columns the pipeline stamps itself).
#
# Names are the Hive column names verbatim (already lowercase), so no
# aliases. Types are the curated types: every CHAR/VARCHAR is STRING and
# trimmed (Hive CHAR arrives blank-padded — keys included — so the trim is
# what makes the key match); SMALLINT / INT keep their source types.
#
# BUSINESS KEY (owner-confirmed 2026-10-01 from the CDC key markers): the
# five business_key = true columns below. curated.merge.keys in the feed
# must list exactly these (HDR_017 fails a contradiction).
#
# nullable is deliberately NOT false anywhere: `nullable = false` is checked
# BEFORE RAW and fails the WHOLE RUN on one defective row. A null/blank key
# is quarantined at the curated merge instead (CUR_001), and
# rejects.max_reject_percent is the alarm.
#
# PARTITION COLUMNS carry category = "audit": the record_hash then ignores
# them (a lookback re-read of an unchanged row hashes identical and is
# skipped), while curated alignment keeps them so the consumer can see which
# delivery supplied the current version. required = true: a source table
# without them is the wrong table.
schema {
  version         = "1.0-e2e"
  compatibility   = "BACKWARD"
  on_extra_column = "WARN"
  columns = [
    # ---- business key ----------------------------------------------------
    { name = "corp_ent_cd",  type = "string",   business_key = true, transform = "nullif(trim({col}), '')" },
    { name = "acct_grp_nbr", type = "string",   business_key = true, transform = "nullif(trim({col}), '')" },
    { name = "sub_seq_nbr",  type = "int",      business_key = true },
    { name = "mem_nbr",      type = "smallint", business_key = true },
    { name = "addr_seq_nbr", type = "smallint", business_key = true },
    # ---- business columns ------------------------------------------------
    { name = "addr_type_cd",  type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "str_ln_1",      type = "string", required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    { name = "str_ln_2",      type = "string", required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    { name = "cty_nm",        type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "cntry_nm",      type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "st_cd",         type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "zip_cd",        type = "string", required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    { name = "cntry_cd",      type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "phn_nbr",       type = "string", required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    { name = "addr_eff_dt",   type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "addr_end_dt",   type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "bad_addr_ind",  type = "string", required = false, transform = "nullif(trim({col}), '')" },
    # ---- source audit (business category: a new capture IS a change) -----
    { name = "last_chg_usrid",  type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "priv_addr_lcts",  type = "string", required = false, transform = "nullif(trim({col}), '')" },
    # CDC capture timestamp — the FRESHNESS column and the lineage
    # source_modified_ts (incremental = true). Must be present: a row without
    # it cannot win or lose a freshness contest (CUR_008).
    { name = "cdc_src_last_updt_ts", type = "string", required = true,  incremental = true, transform = "nullif(trim({col}), '')" },
    # CDC action code DL / PT / UP — the SOFT delete indicator. Must be present.
    { name = "cdc_src_actn_cd",      type = "string", required = true,  transform = "nullif(trim({col}), '')" },
    # ---- source partition columns (audit: excluded from record_hash) -----
    { name = "inc_ful_flag", type = "string", required = true, category = "audit" },
    { name = "file_date",    type = "string", required = true, category = "audit" },
    { name = "file_time",    type = "string", required = true, category = "audit" }
  ]
}
