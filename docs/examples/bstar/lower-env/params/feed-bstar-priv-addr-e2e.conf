# bstar PRIV_ADDR END-TO-END TEST FEED (lower environment)
#
# Same machinery as the production feed, same 24-column contract, its own
# entity and tables so it can run beside the real feed without touching it.
# The SOURCE is a synthetic partitioned Hive table created by
# ../ddl/source_test_data.sql — no real bstar data, no PII — so the
# scenarios (late partition, DL tombstone, replay, purged window) can be
# driven by hand.
#
# Everything lives in ONE database (bluestar_e2e by default): source table,
# curated table and the control tables. Production separates them
# (bstar_raw / bluestar_raw / bluestar_current); the separation is config,
# not code, and the production feed is what proves it.
#
# Entity name differs => its own watermark row, ledger history and lock.
# ---------------------------------------------------------------------------
bstar {
  e2e_db = "bluestar_e2e"
  e2e_db = ${?BSTAR_E2E_DB}
}

feeds {
  bstar_priv_addr_e2e {
    entity = "bstar_priv_addr_e2e"
    mode   = "INCR"

    include required("bstar-priv-addr-e2e-schema.conf")

    source {
      type     = "hive"
      system   = "bstar"
      database = ${bstar.e2e_db}
      table    = "priv_addr_src"
      incremental {
        watermark_columns = ["file_date", "file_time"]
        initial_value     = "1900-01-01|00.00.00"
        watermark_formats = ["yyyy-MM-dd", "HH.mm.ss"]
        # 2 days, not 3: the test data is dated so that scenario 3 (late
        # partition) falls INSIDE the window and scenario 7 (very late
        # partition) falls OUTSIDE it, where --stage reconcile is the detector.
        lookback          = { days = 2 }
        watermark_store   { type = "hive", database = ${bstar.e2e_db} }
      }
      # Scenario 8 drops files under a registered partition; the default
      # FAIL is the behaviour under test. Flip to IGNORE via the override
      # file, never here.
      # missing_files = "FAIL"
      log_partition_counts = true      # per-partition row counts in the driver log
    }

    raw {
      mode                   = "SOURCE"
      record_hash            = true
      lineage_extended       = true
      source_modified_column = "cdc_src_last_updt_ts"
    }

    curated {
      database = ${bstar.e2e_db}
      table    = "priv_addr"
      format   = orc
      merge {
        keys = ["corp_ent_cd", "acct_grp_nbr", "sub_seq_nbr", "mem_nbr", "addr_seq_nbr"]
        freshness {
          column       = "cdc_src_last_updt_ts"
          compare_as   = "timestamp"
          tie_breakers = ["priv_addr_lcts", "file_date", "file_time"]
        }
        deletes {
          mode             = "SOFT"
          indicator_column = "cdc_src_actn_cd"
          indicator_values = ["dl"]
        }
      }
      dedup { order_by = ["cdc_src_last_updt_ts", "priv_addr_lcts"] }
    }

    reconcile {
      enabled     = true
      on_mismatch = "REPORT"
    }

    rejects {
      enabled  = true
      database = ${bstar.e2e_db}
      table    = ingest_rejects
      payload  = "MASKED"
      max_reject_percent = 1.0
      max_reject_count   = 100
    }
    audit {
      database             = ${bstar.e2e_db}
      run_table            = ingest_run_audit
      reconciliation_table = ingest_reconciliation
    }
    concurrency {
      table         = ingest_run_locks
      lease_minutes = 30
    }

    retention {
      rejects              = "90d"
      audit                = "365d"
      watermarks_keep_last = 10
    }

    notifications {
      enabled = true
      on      = ["FAILURE"]
      webhook {
        url        = "REPLACE-WITH-YOUR-WEBHOOK-URL"
        url        = ${?BSTAR_ALERT_WEBHOOK}
        timeout_ms = 5000
      }
    }
  }
}
