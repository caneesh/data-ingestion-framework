# bstar SUB_PREM_DET END-TO-END TEST FEED (lower environment)
#
# Companion to feed-bstar-priv-addr-e2e.conf (read it for the layout): the
# same single-database arrangement, the full 30-column contract, a synthetic
# source table from ../ddl/source_test_data.sql (section S). Its purpose is
# narrower — prove the seven-column composite key, the DECIMAL columns and
# the second entity sharing one set of control tables. The scenario walk is
# priv_addr's.
# ---------------------------------------------------------------------------
bstar {
  e2e_db = "bluestar_e2e"
  e2e_db = ${?BSTAR_E2E_DB}
}

feeds {
  bstar_sub_prem_det_e2e {
    entity = "bstar_sub_prem_det_e2e"
    mode   = "INCR"

    include required("bstar-sub-prem-det-e2e-schema.conf")

    source {
      type     = "hive"
      system   = "bstar"
      database = ${bstar.e2e_db}
      table    = "sub_prem_det_src"
      incremental {
        watermark_columns = ["file_date", "file_time"]
        initial_value     = "1900-01-01|00.00.00"
        watermark_formats = ["yyyy-MM-dd", "HH.mm.ss"]
        lookback          = { days = 2 }
        watermark_store   { type = "hive", database = ${bstar.e2e_db} }
      }
      log_partition_counts = true
    }

    raw {
      mode                   = "SOURCE"
      record_hash            = true
      lineage_extended       = true
      source_modified_column = "cdc_src_last_updt_ts"
    }

    curated {
      database = ${bstar.e2e_db}
      table    = "sub_prem_det"
      format   = orc
      merge {
        keys = ["corp_ent_cd", "acct_nbr", "ben_agmt_nbr", "sub_seq_nbr",
                "sub_prm_hst_sq_nbr", "sub_prm_eff_sq_nbr", "sub_prm_det_sq_nbr"]
        freshness {
          column       = "cdc_src_last_updt_ts"
          compare_as   = "timestamp"
          tie_breakers = ["sub_prem_det_lcts", "file_date", "file_time"]
        }
        deletes {
          mode             = "SOFT"
          indicator_column = "cdc_src_actn_cd"
          indicator_values = ["dl"]
        }
      }
      dedup { order_by = ["cdc_src_last_updt_ts", "sub_prem_det_lcts"] }
    }

    reconcile {
      enabled     = true
      on_mismatch = "REPORT"
    }

    rejects {
      enabled  = true
      database = ${bstar.e2e_db}
      table    = ingest_rejects
      payload  = "MASKED"
      max_reject_percent = 1.0
      max_reject_count   = 100
    }
    audit {
      database             = ${bstar.e2e_db}
      run_table            = ingest_run_audit
      reconciliation_table = ingest_reconciliation
    }
    concurrency {
      table         = ingest_run_locks
      lease_minutes = 30
    }

    retention {
      rejects              = "90d"
      audit                = "365d"
      watermarks_keep_last = 10
    }

    notifications {
      enabled = true
      on      = ["FAILURE"]
      webhook {
        url        = "REPLACE-WITH-YOUR-WEBHOOK-URL"
        url        = ${?BSTAR_ALERT_WEBHOOK}
        timeout_ms = 5000
      }
    }
  }
}
