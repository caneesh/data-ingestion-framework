# bstar SUB_PREM_DET schema contract — 30 columns: 27 source data columns +
# the 3 source PARTITION columns. Mirrors ../ddl/curated_ddl.sql (which adds
# the 6 framework audit columns the pipeline stamps itself).
#
# Names are the Hive column names verbatim; no aliases. Every CHAR/VARCHAR
# is STRING and trimmed (Hive CHAR arrives blank-padded — keys included);
# SMALLINT / INT / DECIMAL(p,s) keep their source types.
#
# BUSINESS KEY (owner-confirmed 2026-10-01 from the CDC key markers): the
# seven business_key = true columns. corp_tier_nbr, tier_agrgt_seq_nbr and
# mem_nbr are NOT key columns. curated.merge.keys must list exactly the
# seven (HDR_017 fails a contradiction).
#
# nullable is deliberately NOT false anywhere (fails the whole run before
# RAW on one defective row); null/blank keys are quarantined at the merge as
# CUR_001 instead. See the priv_addr contract for the partition-column
# rationale (category = audit, required = true).
schema {
  version         = "1.0"
  compatibility   = "BACKWARD"
  on_extra_column = "WARN"
  columns = [
    # ---- business key ----------------------------------------------------
    { name = "corp_ent_cd",        type = "string",   business_key = true, transform = "nullif(trim({col}), '')" },
    { name = "acct_nbr",           type = "string",   business_key = true, transform = "nullif(trim({col}), '')" },
    { name = "ben_agmt_nbr",       type = "smallint", business_key = true },
    { name = "sub_seq_nbr",        type = "int",      business_key = true },
    { name = "sub_prm_hst_sq_nbr", type = "smallint", business_key = true },
    { name = "sub_prm_eff_sq_nbr", type = "smallint", business_key = true },
    { name = "sub_prm_det_sq_nbr", type = "smallint", business_key = true },
    # ---- business columns ------------------------------------------------
    { name = "corp_tier_nbr",      type = "smallint",      required = false },
    { name = "tier_agrgt_seq_nbr", type = "smallint",      required = false },
    { name = "mem_nbr",            type = "smallint",      required = false },
    { name = "prem_amt",           type = "decimal(13,2)", required = false },
    { name = "rate_struc_typ",     type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "split_fee_ind",      type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "bill_tier_abbr",     type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "covd_mem_nbr",       type = "smallint",      required = false },
    { name = "cvg_abbr_cd",        type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "ba_cvg_seq_nbr",     type = "smallint",      required = false },
    { name = "cms_ins_mem_cd",     type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "dob",                type = "string",        required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    { name = "gndr_cd",            type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "tobac_ind",          type = "string",        required = false, transform = "nullif(trim({col}), '')" },
    { name = "tot_prr_fee",        type = "decimal(11,2)", required = false },
    { name = "tot_prr_day_nbr",    type = "smallint",      required = false },
    # ---- source audit (business category: a new capture IS a change) -----
    { name = "last_chg_usrid",    type = "string", required = false, transform = "nullif(trim({col}), '')" },
    { name = "sub_prem_det_lcts", type = "string", required = false, transform = "nullif(trim({col}), '')" },
    # CDC capture timestamp — FRESHNESS column and lineage source_modified_ts.
    { name = "cdc_src_last_updt_ts", type = "string", required = true, incremental = true, transform = "nullif(trim({col}), '')" },
    # CDC action code DL / PT / UP — the SOFT delete indicator.
    { name = "cdc_src_actn_cd",      type = "string", required = true, transform = "nullif(trim({col}), '')" },
    # ---- source partition columns (audit: excluded from record_hash) -----
    { name = "inc_ful_flag", type = "string", required = true, category = "audit" },
    { name = "file_date",    type = "string", required = true, category = "audit" },
    { name = "file_time",    type = "string", required = true, category = "audit" }
  ]
}
