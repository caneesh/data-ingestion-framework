# bstar PRIV_ADDR feed — Hive (bstar_raw.priv_addr) -> CURATED (bluestar_current.priv_addr)
#
# The source is an existing partitioned Hive table, landed by Sqoop from the
# Bluestar DB2 CDC stream and partitioned inc_ful_flag / file_date /
# file_time. The pipeline reads NEW partitions by a tuple watermark over
# (file_date, file_time), re-reads a lookback window for late deliveries,
# and merges latest-per-key into the curated table.
#
#   raw.mode = SOURCE — the source table IS the raw layer. Nothing is written
#   to bluestar_raw except the control tables (ledger, rejects, watermarks,
#   locks). Replay (--stage curated --run-id, --resume, --pending) re-reads
#   the partition window the ledger recorded for the run.
#
# DECISIONS (owner-confirmed 2026-10-01):
#   - business key: corp_ent_cd, acct_grp_nbr, sub_seq_nbr, mem_nbr,
#     addr_seq_nbr (the DB2 primary key, from the CDC key markers).
#     addr_type_cd is NOT a key.
#   - freshness: cdc_src_last_updt_ts (CDC capture timestamp), compare_as =
#     timestamp; tie-break priv_addr_lcts, then the delivering partition.
#   - cdc_src_actn_cd vocabulary: DL = delete, PT = insert, UP = update.
#     DL drives a SOFT delete (is_deleted = true, last_modified_op = 'D').
#   - I and F partitions merge identically; the flag is carried as an audit
#     column, not used for control flow.
#   - partitions are never rewritten in place; the source lands once a day
#     in the morning, but nothing here assumes that cadence.
#
# PRIVACY: str_ln_1, str_ln_2, zip_cd, phn_nbr are PII — tagged in the
# contract so reject payloads mask them. The curated TABLE holds them in
# the clear; restrict access.
# ---------------------------------------------------------------------------
# DATABASES — the one place to point the feed at an environment. Each key
# has a default and an environment override, so ONE file serves lower and
# production. No credentials: the hive source reads through the session's
# own metastore access, so there is no password, no JDBC driver, nothing
# to vault.
#
# CLUSTER MODE: these are read from the DRIVER's environment. With
# --deploy-mode cluster a plain `export` does not reach it — list the names
# in INGEST_ENV_VARS (scripts/run_bstar.sh does) or forward each as
# --conf spark.yarn.appMasterEnv.BSTAR_SOURCE_DB="$BSTAR_SOURCE_DB".
#
# An unforwarded variable silently falls back to the default below — no
# error, wrong database. Check the driver's `[HiveSource] <db>.<table>:`
# log line against what you intended.
# ---------------------------------------------------------------------------
bstar {
  source_db  = "bstar_raw"          # read-only; owned by the Sqoop landing
  source_db  = ${?BSTAR_SOURCE_DB}
  control_db = "bluestar_raw"       # ledger / rejects / watermarks / locks ONLY
  control_db = ${?BSTAR_CONTROL_DB}
  curated_db = "bluestar_current"   # consumer-facing latest-per-key tables
  curated_db = ${?BSTAR_CURATED_DB}
}

feeds {
  bstar_priv_addr {
    entity = "bstar_priv_addr"
    mode   = "INCR"

    include required("bstar-priv-addr-schema.conf")

    source {
      type     = "hive"
      system   = "bstar"                 # -> lineage source_system
      database = ${bstar.source_db}
      table    = "priv_addr"
      # Optional extra scoping — PARTITION COLUMNS ONLY (HIVE_004 otherwise).
      # Not set: I and F partitions are both wanted and merge identically.
      # where  = "inc_ful_flag IN ('I','F')"

      incremental {
        # The watermark is the partition tuple, in this order. Both are
        # STRING partition columns (HIVE_003 refuses typed ones: a DATE
        # partition column would reorder '2026-1-5' and '2026-01-05').
        watermark_columns = ["file_date", "file_time"]
        # One component per column, '|' separated. First light reads every
        # partition above this; a later override of this value is a NO-OP
        # once a watermark row exists (runbook §2.3 for a deliberate rewind).
        initial_value     = "1900-01-01|00.00.00"
        # STRICT formats, one per column. The length guard alone would let
        # 99.99.99 through; a partition that does not parse fails HIVE_006
        # rather than silently sorting into the wrong place.
        watermark_formats = ["yyyy-MM-dd", "HH.mm.ss"]
        # Re-read every partition newer than (watermark - 3 days) on every
        # run, so a late file for an older file_date, a partition registered
        # before its files landed, or a re-run delivery all reach curated —
        # where freshness absorbs the duplicates. 3 days = "how late can a
        # file arrive?" from the source owner, with margin. Alternative:
        # { partitions = N } to rewind by a count instead of by days.
        lookback          = { days = 3 }
        watermark_store   { type = "hive", database = ${bstar.control_db} }
      }
    }

    raw {
      # SOURCE: the hive table is the raw layer; nothing is written. COPY
      # (the default every other feed uses) would write a physical RAW table
      # in bluestar_raw — see docs/examples/feed-hive-reference.conf for the
      # COPY-mode equivalent of this block.
      #
      # Under SOURCE the keys that name or govern a RAW table (database,
      # table, delivery_mode, idempotency_key, partitioning) are REJECTED
      # (CFG_028), as is retention.raw: there is no table to purge, and the
      # source owner's retention IS the replay horizon (HIVE_008 when a
      # recorded window has been purged).
      mode                   = "SOURCE"
      record_hash            = true    # stamped in memory; curated keeps it for the no-change skip
      lineage_extended       = true    # source_modified_ts / source_operation / source_primary_key
      source_modified_column = "cdc_src_last_updt_ts"
    }

    curated {
      database = ${bstar.curated_db}
      table    = "priv_addr"
      format   = orc
      # Latest-per-key: unpartitioned on purpose (CUR_006 + churn). The DDL in
      # ../ddl/curated_ddl.sql pre-creates it for consumers; the framework
      # would create the same table if it were absent.
      merge {
        # Must equal the contract's business_key set (HDR_017 otherwise).
        keys = ["corp_ent_cd", "acct_grp_nbr", "sub_seq_nbr", "mem_nbr", "addr_seq_nbr"]
        # The CDC capture timestamp decides which version of a key is newest,
        # whichever partition delivered it. compare_as = timestamp keeps the
        # comparison chronological while storage stays STRING; an unparseable
        # value fails CUR_008 instead of silently losing every contest. The
        # partition tuple breaks ties: later delivery wins.
        freshness {
          column       = "cdc_src_last_updt_ts"
          compare_as   = "timestamp"
          tie_breakers = ["priv_addr_lcts", "file_date", "file_time"]
        }
        # A DL row merges as a tombstone — freshness still decides whether it
        # is the newest version — and the framework stamps is_deleted = true,
        # last_modified_op = 'D'. The match is lower(trim(value)), so the
        # CHAR(2) padding and case are irrelevant; the value is lowercase here.
        deletes {
          mode             = "SOFT"
          indicator_column = "cdc_src_actn_cd"
          indicator_values = ["dl"]
        }
      }
      # Within one batch, duplicate keys tied on freshness fall through to
      # these columns, so the surviving row is deterministic.
      dedup { order_by = ["cdc_src_last_updt_ts", "priv_addr_lcts"] }
    }

    # INDEPENDENT SOURCE COMPARISON (--stage reconcile, its own schedule).
    # Every within-run check is an identity; a partition that lands AFTER the
    # lookback window has closed, or a dropped partition, leaves the ledger
    # clean and the consumer as the detector. The hive reconciler compares
    # the source's distinct key set against curated — a key-only projection
    # of the whole source table, so run it OFF-PEAK.
    #
    # REPORT, not FAIL: there is no batch to stop. Findings land in
    # ingest_reconciliation and alert through notifications; the job exits 0
    # and the operator reads the FAILED rows (runbook §1).
    reconcile {
      enabled     = true
      on_mismatch = "REPORT"
    }

    # CONTROL TABLES — all in bluestar_raw, which hosts NOTHING else. Names
    # are explicit so a collision with another pipeline is a config change,
    # not a surprise.
    rejects {
      enabled  = true
      database = ${bstar.control_db}
      table    = ingest_rejects
      payload  = "MASKED"              # PII-tagged columns hash automatically
      # Ceiling on silent loss. Unset means UNBOUNDED — every row could be
      # rejected and the run still SUCCESS. Observed normal is zero rejects
      # (null keys are quarantined as CUR_001, not failed), so 1% tolerates a
      # stray row while a systemic break trips immediately; the count is the
      # small-batch guard.
      max_reject_percent = 1.0
      max_reject_count   = 100
    }
    audit {
      database             = ${bstar.control_db}
      run_table            = ingest_run_audit
      reconciliation_table = ingest_reconciliation
      # VOLUME FLOOR — deliberately off. The source lands once a day, but a
      # day with no CDC activity is a legitimate empty window; a floor would
      # page on it. Decide after a week of ledger history (query in the
      # smartiq feed's audit block applies verbatim with entity =
      # 'bstar_priv_addr'). The absent-run case is covered from OUTSIDE by
      # scripts/check_freshness.sh and check_source_freshness.sh.
      # min_accepted_rows = 1
    }
    # lease_minutes = how long a CRASHED run blocks the entity, not how long
    # a run may take (the heartbeat renews every lease/3).
    concurrency {
      table         = ingest_run_locks
      lease_minutes = 30
    }

    # RETENTION (--stage retention, the PURGE job). NO retention.raw: under
    # raw.mode = SOURCE there is no RAW table, and the key is rejected
    # (CFG_028). The SOURCE's retention is owned by the bstar_raw owner and
    # bounds how far back a replay can reach.
    retention {
      rejects              = "90d"
      audit                = "365d"
      watermarks_keep_last = 10
    }

    # FAILURE ALERTING — best effort, redacted, never fails the run. SET THE
    # URL (BSTAR_ALERT_WEBHOOK in bstar.env) before relying on it.
    notifications {
      enabled = true
      on      = ["FAILURE"]
      webhook {
        url        = "REPLACE-WITH-YOUR-WEBHOOK-URL"
        url        = ${?BSTAR_ALERT_WEBHOOK}
        timeout_ms = 5000
      }
    }
  }
}
