# bstar SUB_PREM_DET feed — Hive (bstar_raw.sub_prem_det) -> CURATED (bluestar_current.sub_prem_det)
#
# Same shape as feed-bstar-priv-addr.conf, which carries the full rationale
# for every block; only the table, keys, tie-breakers and the sizing notes
# differ. Read that file first.
#
# DECISIONS (owner-confirmed 2026-10-01):
#   - business key: corp_ent_cd, acct_nbr, ben_agmt_nbr, sub_seq_nbr,
#     sub_prm_hst_sq_nbr, sub_prm_eff_sq_nbr, sub_prm_det_sq_nbr (the DB2
#     primary key). corp_tier_nbr, tier_agrgt_seq_nbr, mem_nbr are NOT keys.
#   - freshness: cdc_src_last_updt_ts (compare_as = timestamp); tie-break
#     sub_prem_det_lcts, then the delivering partition.
#   - cdc_src_actn_cd: DL = delete (SOFT), PT = insert, UP = update.
#
# SIZING: the source is ~30.9 GB of UNCOMPRESSED pipe-delimited text across
# 637 partitions. First light reads all of it — a real Spark job where parse
# cost dominates; set INGEST_DRIVER_MEMORY / INGEST_EXECUTOR_MEMORY in
# bstar.env for it. Steady state reads one day plus the 3-day lookback.
#
# PRIVACY: dob is PII — tagged in the contract; the curated TABLE holds it
# in the clear. Restrict access.
# ---------------------------------------------------------------------------
bstar {
  source_db  = "bstar_raw"
  source_db  = ${?BSTAR_SOURCE_DB}
  control_db = "bluestar_raw"
  control_db = ${?BSTAR_CONTROL_DB}
  curated_db = "bluestar_current"
  curated_db = ${?BSTAR_CURATED_DB}
}

feeds {
  bstar_sub_prem_det {
    entity = "bstar_sub_prem_det"
    mode   = "INCR"

    include required("bstar-sub-prem-det-schema.conf")

    source {
      type     = "hive"
      system   = "bstar"
      database = ${bstar.source_db}
      table    = "sub_prem_det"
      # where  = "inc_ful_flag IN ('I','F')"     # partition columns only; not needed

      incremental {
        watermark_columns = ["file_date", "file_time"]
        initial_value     = "1900-01-01|00.00.00"
        watermark_formats = ["yyyy-MM-dd", "HH.mm.ss"]
        lookback          = { days = 3 }
        watermark_store   { type = "hive", database = ${bstar.control_db} }
      }
    }

    raw {
      mode                   = "SOURCE"
      record_hash            = true
      lineage_extended       = true
      source_modified_column = "cdc_src_last_updt_ts"
    }

    curated {
      database = ${bstar.curated_db}
      table    = "sub_prem_det"
      format   = orc
      merge {
        keys = ["corp_ent_cd", "acct_nbr", "ben_agmt_nbr", "sub_seq_nbr",
                "sub_prm_hst_sq_nbr", "sub_prm_eff_sq_nbr", "sub_prm_det_sq_nbr"]
        freshness {
          column       = "cdc_src_last_updt_ts"
          compare_as   = "timestamp"
          tie_breakers = ["sub_prem_det_lcts", "file_date", "file_time"]
        }
        deletes {
          mode             = "SOFT"
          indicator_column = "cdc_src_actn_cd"
          indicator_values = ["dl"]
        }
      }
      dedup { order_by = ["cdc_src_last_updt_ts", "sub_prem_det_lcts"] }
    }

    # Key-only projection of a 30 GB text table: schedule this OFF-PEAK.
    reconcile {
      enabled     = true
      on_mismatch = "REPORT"
    }

    rejects {
      enabled  = true
      database = ${bstar.control_db}
      table    = ingest_rejects
      payload  = "MASKED"
      max_reject_percent = 1.0
      max_reject_count   = 100
    }
    audit {
      database             = ${bstar.control_db}
      run_table            = ingest_run_audit
      reconciliation_table = ingest_reconciliation
      # min_accepted_rows = 1       # decide after a week of ledger history
    }
    concurrency {
      table         = ingest_run_locks
      lease_minutes = 30
    }

    # No retention.raw under raw.mode = SOURCE (CFG_028).
    retention {
      rejects              = "90d"
      audit                = "365d"
      watermarks_keep_last = 10
    }

    notifications {
      enabled = true
      on      = ["FAILURE"]
      webhook {
        url        = "REPLACE-WITH-YOUR-WEBHOOK-URL"
        url        = ${?BSTAR_ALERT_WEBHOOK}
        timeout_ms = 5000
      }
    }
  }
}
