# =============================================================================
# REFERENCE CONFIGURATION — FILE INGESTION FEED
# =============================================================================
# Every supported option for a file-based feed, with commentary. Use it as a
# copy-paste catalog, not as a runnable config: trim to what your feed needs
# (most blocks are optional and have sensible defaults).
#
# Run with:  --entity member_file_feed --conf-path docs/examples/feed-file-reference.conf
# Validate:  add --validate-only --explain-mapping   (no Spark reads)
# =============================================================================

app {
  spark {
    appName = "DataIngestionFramework"
    master  = "yarn"                       # overridden by spark-submit --master
    # session_time_zone = "UTC"            # explicit Spark session timezone
  }
}

feeds {
  member_file_feed {
    entity = "member_file_feed"
    mode   = "FULL"                        # FULL (overwrite) | INCR (keyed merge)

    # =========================================================================
    # SCHEMA CONTRACT — canonical columns, aliases, drift policies
    # =========================================================================
    schema {
      version       = "1.0"
      compatibility = "BACKWARD"

      # Drift policies: FAIL | WARN | IGNORE
      on_missing_column        = "FAIL"
      on_extra_column          = "WARN"
      on_type_change           = "FAIL"
      on_order_change          = "WARN"
      on_duplicate_header      = "FAIL"
      on_nullability_violation = "FAIL"
      on_version_mismatch      = "WARN"    # contract version vs RAW table property

      columns = [
        {
          name     = "subscriber_id"       # canonical name — the ONLY name that
          type     = "string"              # flows into RAW/CURATED tables
          nullable = false
          required = true
          aliases  = ["subscriber id", "subscriberid", "member subscriber id"]
          position = 0                     # declared order, checked by on_order_change
        },
        {
          name     = "hios_id"
          type     = "string"
          nullable = false
          required = true
          aliases  = ["plan_hios_id", "hios id", "hiosid", "plan hios id"]
          position = 1
          regex    = "^[0-9]{5}[A-Z][0-9]{4}$"  # content rule: detects swapped columns
        },
        {
          name     = "middle_name"
          type     = "string"
          required = false                 # optional: a missing column gets the default
          default  = null
          position = 2
        }
      ]

      # Header matching strategy:
      #   STRICT_NAME                  canonical names only, aliases ignored
      #   NAME_WITH_ALIASES (default)  canonical names + approved aliases
      #   NAME_ALIAS_POSITION_FALLBACK names/aliases first, then guarded
      #                                positional fallback (stable-order vendors only)
      header_validation {
        strategy              = "NAME_WITH_ALIASES"
        on_missing_required   = "FAIL"           # never silently null-fill a rename
        on_missing_optional   = "ADD_DEFAULT"
        on_extra_columns      = "WARN"
        on_duplicate_columns  = "FAIL"
        quarantine_on_failure = true             # move failing files to quarantine

        # Only meaningful with strategy = NAME_ALIAS_POSITION_FALLBACK:
        # positional_fallback {
        #   enabled                    = true
        #   require_exact_column_count = true
        #   require_content_validation = true
        # }
      }

      # Column content validation (detects swapped / mismapped columns)
      content_validation {
        enabled                    = true
        mode                       = "SAMPLE"    # SAMPLE | FULL
        sample_rows                = 1000
        maximum_failure_percentage = 0.0
      }
    }

    # =========================================================================
    # SOURCE — file connector
    # =========================================================================
    source {
      type      = "file"
      file_type = "csv"                    # csv | json | parquet | orc

      # --- CSV options -------------------------------------------------------
      header       = true
      delimiter    = ","
      quote        = "\""
      escape       = "\\"
      multiline    = false
      drop_trailer = false                 # drop a trailing summary row

      # Positional recovery is opt-in with a schema contract: headers are
      # still validated first so drift surfaces before mapping by position.
      # force_columns_by_position = true

      # --- Option A: static path glob ---------------------------------------
      # path = "hdfs:///data/incoming/membership/*.csv"

      # --- Option B: managed file lifecycle (recommended; replaces `path`) --
      # Files flow landing -> inprogress -> processed (+ optional archive
      # copy); invalid files -> quarantine with a recorded reason.
      folders {
        landing    = "hdfs:///data/membership/landing"
        inprogress = "hdfs:///data/membership/inprogress"
        processed  = "hdfs:///data/membership/processed"
        archive    = "hdfs:///data/membership/archive"      # optional
        quarantine = "hdfs:///data/membership/quarantine"
      }

      # --- Pre-read file validation (quarantines on failure) ----------------
      validation {
        filename_pattern   = "member_.*[.]csv"
        allowed_extensions = ["csv"]
        encoding           = "UTF-8"
        min_size_bytes     = 1
        max_size_bytes     = 1073741824    # 1 GiB
        delimiter          = ","           # sampled rows must contain it
        checksum {
          sidecar_suffix = ".sha256"       # expects member_x.csv.sha256 next to the file
          required       = false
          algorithm      = "SHA-256"
        }
        header {
          expected_columns = 3
          expected_names   = ["subscriber id", "plan_hios_id", "middle_name"]
        }
        trailer {
          required = false
          marker   = "TRL"                 # trailer line marker text
        }
      }
    }

    # =========================================================================
    # IDEMPOTENCY — content-based duplicate file protection (SHA-256 registry)
    # =========================================================================
    idempotency {
      database         = "ingest_audit"
      registry_table   = "ingest_file_registry"
      duplicate_policy = "SKIP"            # SKIP | REJECT | REPROCESS_WITH_APPROVAL
    }                                      # (--force-reprocess overrides at run time)

    # =========================================================================
    # REJECTS — record-level rules routed to a reject table
    # =========================================================================
    rejects {
      database = "ingest_audit"
      table    = "ingest_rejects"
      use_contract_nullability = true      # derive null checks from the contract
      rules = [
        {
          name       = "missing_subscriber"
          condition  = "subscriber_id IS NULL OR trim(subscriber_id) = ''"
          error_code = "R001"
          category   = "MISSING_KEY"
          message    = "subscriber_id is required"
        }
      ]
      max_reject_count   = 1000            # fail the run past either threshold
      max_reject_percent = 5.0

      # Watermark policy when rows were rejected this run:
      #   ADVANCE (default) commit the window; rejects are recoverable only
      #                     from the reject-table payload
      #   HOLD              keep the watermark; the window re-extracts next
      #                     run, recovering rejects once the cause is fixed
      #                     (previously accepted rows re-append into RAW as
      #                     documented duplicates; curated dedup absorbs them)
      on_reject_watermark = "ADVANCE"
    }

    # =========================================================================
    # AUDIT & RECONCILIATION — control totals per run
    # =========================================================================
    audit {
      database           = "ingest_audit"
      control_total_expr = "count(*)"
      reconciliation { on_mismatch = "WARN" }   # WARN | FAIL
    }

    # =========================================================================
    # CONCURRENCY — run-level entity locking
    # =========================================================================
    concurrency {
      lock          = "REQUIRED"           # REQUIRED (default) | OFF
      database      = "ingest_audit"       # defaults to audit.database
      table         = "ingest_run_locks"
      lease_minutes = 240                  # crashed-run lease expiry (default 4h)
      settle_ms     = 2000                 # settle wait after acquiring
    }

    # =========================================================================
    # RAW — append-only landing table (ORC), business data untouched
    # =========================================================================
    raw {
      database = "membership_raw"
      table    = "member_file_feed"
      path     = "hdfs:///data/warehouse/membership/raw/member_file_feed"
      format   = "orc"

      partitioning {
        keys = ["ingest_dt"]
        derive {
          ingest_dt {
            kind = "expr"
            expr = "date_format(current_timestamp(), 'yyyy-MM-dd')"
          }
        }
      }
    }

    # =========================================================================
    # CURATED — typed, merged, consumer-facing current state
    # =========================================================================
    curated {
      enabled  = true
      database = "membership_curated"
      table    = "member_file_feed"
      path     = "hdfs:///data/warehouse/membership/curated/member_file_feed"
      format   = "orc"

      # Cast columns on the way in (names matched case-insensitively)
      column_types {
        subscriber_id = "string"
        hios_id       = "string"
      }

      # Derived columns (Spark SQL expressions)
      transform {
        derive = [
          { name = "create_timestamp", expr = "current_timestamp()" }
        ]
      }

      merge {
        keys = ["subscriber_id", "hios_id"]     # business keys (INCR upsert; key
                                                # hygiene enforced in FULL too)
        null_handling {
          drop_null_keys      = true            # quarantine null-key rows
          treat_blank_as_null = true
        }
        # Source-provided freshness decides the merge winner (otherwise run
        # order wins). Must be a source column, not a framework audit column.
        # freshness {
        #   column       = "modified_date"
        #   tie_breakers = ["record_seq"]
        # }
      }

      dedup {
        order_by = ["modified_date"]            # latest wins per key
      }

      # Publish-time safety valves (transactional staging -> validate -> swap)
      publish {
        allow_empty         = false             # refuse to publish an empty frame
        enforce_unique_keys = true              # default: true when merge.keys set
        max_shrink_percent  = 20.0              # fail if the table shrinks more
        # validation_query  = "SELECT count(*) FROM {table} WHERE subscriber_id IS NULL"
      }
    }
  }
}
