# =============================================================================
# REFERENCE CONFIGURATION — HIVE (EXISTING PARTITIONED TABLE) INGESTION FEED
# =============================================================================
# Every supported option for a `source.type = "hive"` feed, with commentary.
# A copy-paste catalog, not a runnable config: the two raw modes are
# mutually exclusive — pick one and trim the other.
#
# WHAT A HIVE SOURCE IS: an existing, partitioned Hive table that some other
# process keeps appending partitions to (a Sqoop landing, a file drop with
# MSCK REPAIR, another pipeline's output). The framework reads NEW partitions
# by a lexicographic watermark over the partition values — no JDBC, no
# credential, no driver jar: the Spark session's own metastore access.
#
# Runnable example with real decisions: docs/examples/bstar/params/.
#
# Run with:  --entity events_hive_feed --mode INCR --conf-path docs/examples/feed-hive-reference.conf
# Validate:  add --validate-only                   (config + contract + table/column checks, no reads)
# =============================================================================

feeds {
  events_hive_feed {
    entity = "events_hive_feed"
    mode   = "INCR"                      # INCR reads partitions above the watermark.
                                         # FULL reads everything and is REFUSED once a
                                         # watermark row exists (HIVE_007) — rewind
                                         # instead (runbook §2.3).

    # Optional, typed. A hive source derives PARTITION_INCREMENTAL; declaring
    # anything else is CFG_011.
    # ingestion { pattern = "PARTITION_INCREMENTAL" }

    # The contract is MANDATORY for a hive feed: the partition columns must be
    # declared (category = "audit" keeps them out of record_hash and in
    # curated), and the business key drives the merge.
    schema {
      version = "1.0"
      columns = [
        { name = "event_id",   type = "string", business_key = true, transform = "nullif(trim({col}), '')" },
        { name = "payload",    type = "string", required = false },
        { name = "updated_ts", type = "string", required = true, incremental = true },   # freshness + lineage source_modified_ts
        { name = "op_cd",      type = "string", required = true },                       # soft-delete indicator
        # Partition columns: present in the source, excluded from the hash,
        # kept in curated as "which delivery supplied this version".
        { name = "load_date",  type = "string", required = true, category = "audit" },
        { name = "load_time",  type = "string", required = true, category = "audit" }
      ]
    }

    # =========================================================================
    # SOURCE
    # =========================================================================
    source {
      type     = "hive"
      system   = "events"               # lineage source_system (default: the entity)
      database = "landing_db"           # REQUIRED (CFG_023)
      table    = "events"               # REQUIRED (CFG_023). HIVE_002 if absent/invisible.

      # Extra scoping, PARTITION COLUMNS ONLY — it is pushed to the metastore
      # as a partition filter. A data column here is HIVE_004.
      # where = "region = 'US'"

      # Files vanished under a REGISTERED partition. FAIL (default): the read
      # errors, because a half-deleted partition is a data problem. IGNORE:
      # spark.sql.files.ignoreMissingFiles for this read; zero-row partitions
      # are logged. Flip through the override file, never permanently.
      # missing_files = "FAIL"

      # Log a row count per partition read (one extra count per partition —
      # cheap on ORC/Parquet, a full scan on text). Default false.
      # log_partition_counts = false

      incremental {
        # The watermark is the TUPLE of these partition columns, compared
        # lexicographically component by component, in this order. They must
        # be STRING partition columns (HIVE_003 otherwise: a DATE or INT
        # partition column cannot be compared as text safely).
        watermark_columns = ["load_date", "load_time"]

        # One component per column, '|' separated (CFG_025 on a mismatch).
        # Used ONLY while no watermark row exists; changing it later is a
        # no-op. To reload from an earlier point: runbook §2.3.
        initial_value     = "1900-01-01|00.00.00"

        # STRICT per-component formats (java DateTimeFormatter). Every
        # partition value in the window must parse (HIVE_006) and values must
        # be uniformly zero-padded, so '2026-1-5' can never sort after
        # '2026-01-05'. Optional but STRONGLY recommended for date/time parts.
        watermark_formats = ["yyyy-MM-dd", "HH.mm.ss"]

        # Re-read partitions above (watermark − N) every run. Exactly ONE of:
        lookback = { days = 3 }         # rewind the FIRST component by N days
                                        # (it must parse with watermark_formats[0])
        # lookback = { partitions = 2 } # rewind by N registered partitions
        # Absent = none. Both = CFG_027. The ledger records the STORED
        # watermark as window_start, never the rewound bound.

        # Where the watermark lives. hive (default) — the shared
        # ingest_watermarks table; memory — tests only.
        watermark_store {
          type     = "hive"
          database = "control_db"       # REQUIRED for hive
          # table  = "ingest_watermarks"
        }

        # JDBC-only knobs are REJECTED on a hive source (CFG_024):
        #   overlap, watermark_type, upper_bound, clock_zone
      }
    }

    # =========================================================================
    # RAW — pick ONE mode
    # =========================================================================
    # ---- COPY (default): a physical RAW table, like every other feed -------
    raw {
      # mode          = "COPY"
      database        = "raw_db"
      table           = "events"
      format          = orc
      record_hash     = true
      lineage_extended = true
      # source_modified_column = "updated_ts"     # default: the contract's incremental column
      delivery_mode   = "DEDUPLICATED_APPEND"
      idempotency_key = ["event_id", "load_date", "load_time"]
      partitioning {
        keys = ["ingest_dt"]                     # exactly this name: retention + --resume-ingest-dt key off it
        derive { ingest_dt = "date_format(current_timestamp(), 'yyyy-MM-dd')" }
      }
    }
    # ---- SOURCE: the hive table IS the raw layer; nothing is written --------
    # raw {
    #   mode             = "SOURCE"
    #   record_hash      = true          # stamped in memory; curated keeps it
    #   lineage_extended = true
    #   source_modified_column = "updated_ts"
    #   # REJECTED under SOURCE (CFG_028): database, table, delivery_mode,
    #   # idempotency_key, partitioning, and retention.raw. Requires
    #   # source.type = hive and watermark_columns (the run's recorded window
    #   # is the only description of its raw slice). --resume-ingest-dt is
    #   # CFG_028 too: replay is by --run-id, re-reading the recorded window
    #   # from the source — HIVE_008 if that window has since been purged.
    # }

    # =========================================================================
    # CURATED — unchanged framework config
    # =========================================================================
    curated {
      database = "curated_db"
      table    = "events_current"
      format   = orc
      merge {
        keys = ["event_id"]                         # must equal the contract's business_key (HDR_017)
        freshness {
          column       = "updated_ts"
          compare_as   = "timestamp"
          tie_breakers = ["load_date", "load_time"] # later delivery wins a tie
        }
        deletes { mode = "SOFT", indicator_column = "op_cd", indicator_values = ["d"] }  # lower(trim(value))
      }
      dedup { order_by = ["updated_ts"] }
    }

    # --stage reconcile: distinct source keys vs curated keys (key-only
    # projection of the WHOLE source table — schedule off-peak).
    reconcile { enabled = true, on_mismatch = "REPORT" }   # REPORT (exit 0, FAILED rows in the table) | FAIL (exit 20)

    rejects     { enabled = true, database = "control_db", table = ingest_rejects, payload = "MASKED",
                  max_reject_percent = 1.0, max_reject_count = 100 }
    audit       { database = "control_db", run_table = ingest_run_audit, reconciliation_table = ingest_reconciliation }
    concurrency { table = ingest_run_locks, lease_minutes = 30 }
    retention   { rejects = "90d", audit = "365d", watermarks_keep_last = 10
                  # raw = "365d"   # COPY only; CFG_028 under SOURCE
                }
    notifications { enabled = true, on = ["FAILURE"], webhook { url = ${?EVENTS_ALERT_WEBHOOK}, timeout_ms = 5000 } }
  }
}
