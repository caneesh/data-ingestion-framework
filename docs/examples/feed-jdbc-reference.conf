# =============================================================================
# REFERENCE CONFIGURATION — JDBC (SQL) INGESTION FEED
# =============================================================================
# Every supported option for a JDBC feed, with commentary. Use it as a
# copy-paste catalog, not as a runnable config: the four read modes and the
# alternative auth providers are mutually exclusive — pick one of each and
# trim the rest. Defaults are noted where they exist.
#
# Run with:  --entity claims_jdbc_feed --mode INCR --conf-path docs/examples/feed-jdbc-reference.conf
# Validate:  add --validate-only                   (no Spark reads)
# =============================================================================

app {
  spark {
    appName = "DataIngestionFramework"
    master  = "yarn"
    # session_time_zone = "UTC"
  }
}

feeds {
  claims_jdbc_feed {
    entity = "claims_jdbc_feed"
    mode   = "INCR"                        # FULL | INCR

    # =========================================================================
    # INGESTION PATTERN (optional, typed) — derived from the source config
    # when absent; declaring it validates the intent against the derived
    # shape (CFG_011 on contradiction).
    #   Shapes:  FULL_SNAPSHOT | FULL_THEN_INCREMENTAL | TIMESTAMP_INCREMENTAL
    #            | TIMESTAMP_OVERLAP | COMPOSITE_WATERMARK | ROWVERSION_INCREMENTAL
    #   Intent:  BACKFILL | RAW_REPLAY   (default watermark_commit = false —
    #            re-reading history must not burn the live window)
    #   Declared capabilities (NOT implemented, fail with CFG_010):
    #            CHANGE_TRACKING | CDC_BATCH
    # =========================================================================
    # ingestion {
    #   pattern          = "TIMESTAMP_OVERLAP"
    #   watermark_commit = true            # only meaningful for BACKFILL/RAW_REPLAY
    # }

    # =========================================================================
    # SOURCE — JDBC connector
    # =========================================================================
    source {
      type = "jdbc"

      # --- Connection --------------------------------------------------------
      url = "jdbc:sqlserver://myserver.database.windows.net:1433;databaseName=ClaimsDB"
      # dialect = "sqlserver"              # inferred from the url prefix; set
                                           # explicitly for engines the registry
                                           # cannot infer (e.g. "generic" for H2)
      # driver  = "com.microsoft.sqlserver.jdbc.SQLServerDriver"  # dialect default

      # Extra driver properties, merged over the dialect defaults. The
      # sqlserver dialect enforces encrypt=true, trustServerCertificate=false.
      connection_properties {
        loginTimeout = "30"
        # encrypt = "false"                # local throwaway containers ONLY —
      }                                    # requires allow_insecure_tls below
      # allow_insecure_tls = true          # explicit opt-out gate for non-prod

      # --- Authentication (secret providers) --------------------------------
      # Providers: inline | env | sysprop | file | cyberark | conjur | azure_keyvault
      # Secrets never appear in logs or error messages.
      auth {
        user     = "svc_ingest"            # plain value, or a provider object
        password = { provider = "env", key = "SQLSERVER_PWD" }

        # password = { provider = "file",    path = "/etc/secrets/sql_pwd" }
        # password = { provider = "sysprop", key  = "sql.pwd" }
        # password = { provider = "inline",  value = "never-in-git" }

        # CyberArk CCP — one vault object can serve BOTH credentials
        # (client certificate configured via JVM TLS keystore settings):
        # user = {
        #   provider  = "cyberark"
        #   url       = "https://ccp.example.com"
        #   app_id    = "APP_DataIngestion"
        #   safe      = "AAM_DB_Safe"
        #   object    = "azure-sql-svc-ingest"
        #   attribute = "UserName"
        # }
        # password = {
        #   provider = "cyberark"
        #   url      = "https://ccp.example.com"
        #   app_id   = "APP_DataIngestion"
        #   safe     = "AAM_DB_Safe"
        #   object   = "azure-sql-svc-ingest"
        #   # attribute = "Content" is the default (the password itself)
        # }

        # Conjur — api_key is itself a secret reference (env/file/sysprop/...):
        # password = {
        #   provider = "conjur"
        #   url      = "https://conjur.example.com"
        #   account  = "myorg"
        #   host_id  = "data/ingestion/spark"
        #   api_key  = { provider = "env", key = "CONJUR_API_KEY" }
        #   variable = "applications/ingestion/database/password"
        # }

        # Azure Key Vault (DefaultAzureCredential; optional secret_version):
        # password = { provider = "azure_keyvault",
        #              vault_url = "https://myvault.vault.azure.net",
        #              secret_name = "sql-pwd" }

        # All vault providers cache with a TTL: cache_ttl_ms = 300000 (default 5m)
      }

      # --- Read mode (pick ONE) ----------------------------------------------
      mode  = "INCREMENTAL"                # FULL_TABLE | SELECT_QUERY | CUSTOM_SQL | INCREMENTAL
      table = "dbo.claims"                 # FULL_TABLE / SELECT_QUERY / INCREMENTAL

      # CUSTOM_SQL instead of table (wrapped as a subquery, dialect-quoted):
      # sql = "SELECT c.*, p.plan_name FROM dbo.claims c JOIN dbo.plans p ON c.plan_id = p.plan_id"
      # ("query" is accepted as an alias for "sql")

      # --- Projection & filters ----------------------------------------------
      # Plain projection:
      # columns = ["claim_id", "amount", "modified_ts"]
      # Structured projection with renames (source column -> target name);
      # bracket/space-safe identifiers are quoted per dialect:
      # columns = [
      #   { source = "Claim ID",  target = "claim_id" },
      #   { source = "amount",    target = "amount" }
      # ]
      where = "state IN ('IL','TX')"       # pushed down inside the database
      # filters = ["amount > 0", "claim_type = 'M'"]   # ANDed structured filters

      # --- Incremental watermark (mode = INCREMENTAL) ------------------------
      incremental {
        # TIMESTAMP | NUMERIC | DATE | DATETIMEOFFSET | ROWVERSION | STRING | COMPOSITE
        watermark_type    = "TIMESTAMP"
        watermark_columns = ["modified_ts"]
        initial_value     = "1900-01-01 00:00:00"

        # COMPOSITE: one scalar type per column, e.g. timestamp + tie-breaker key
        # watermark_type    = "COMPOSITE"
        # watermark_columns = ["modified_ts", "claim_id"]
        # column_types      = ["TIMESTAMP", "NUMERIC"]

        # Re-read window behind the committed watermark (seconds for
        # TIMESTAMP, units of the type otherwise). Protects against
        # same-timestamp late inserts.
        overlap = "300"

        # Unprotected-watermark policy: a TIMESTAMP watermark with no overlap
        # and no composite tie-breaker can miss boundary rows.
        on_unprotected_watermark = "WARN"  # WARN (default) | FAIL

        # Upper bound captured BEFORE the read (bounded window):
        #   MAX_VALUE    (default) MAX(watermark column) at capture time
        #   SOURCE_CLOCK the source database's clock — idle sources still advance
        upper_bound = "MAX_VALUE"
        # SOURCE_CLOCK + plain TIMESTAMP column requires declaring the zone
        # the column stores (mismatch silently skips one offset of rows):
        # clock_zone = "UTC"               # UTC | LOCAL

        # allow_null_watermark   = false   # true: proceed unbounded when the
                                           # source has only NULL watermarks
        # allow_string_watermark = false   # STRING compares lexicographically;
                                           # approve explicitly per feed

        watermark_store {
          type     = "hive"
          database = "ingest_audit"
          table    = "ingest_watermarks"   # default
        }

        # FULL_THEN_INCREMENTAL seed pulls are bounded at the captured
        # cutoff (rows beyond it belong to the first incremental window);
        # opt out for the legacy unbounded seed read.
        # bound_full_load = true

        # Window convention:
        #   LEGACY (default)  (lower, upper]  — historical, wire-compatible
        #   HALF_OPEN         [lower, upper)  — the spec's convention; scalar
        #                     watermarks with upper_bound = SOURCE_CLOCK only
        #                     (a MAX_VALUE upper would skip the max row forever)
        # boundary_convention = "LEGACY"

        # SOURCE_CLOCK captures warn when |source - driver| clock drift
        # exceeds this many millis (0 disables).
        # clock_drift_warn_ms = 30000
      }

      # --- Parallel read partitioning ----------------------------------------
      # STATIC_RANGE (default): fixed numeric range split
      partition_strategy = "STATIC_RANGE"  # STATIC_RANGE | MIN_MAX_QUERY | PREDICATES
      numPartitions      = 10
      partitionColumn    = "claim_id"
      lowerBound         = 1
      upperBound         = 10000000

      # MIN_MAX_QUERY: bounds discovered by probing MIN/MAX — configure only
      # partitionColumn + numPartitions, never lowerBound/upperBound.
      # partition_strategy = "MIN_MAX_QUERY"

      # PREDICATES: one partition per predicate, exclusive with range options.
      # partition_strategy   = "PREDICATES"
      # partition_predicates = ["region = 'EAST'", "region = 'WEST'"]

      # max_partitions = 64                # operational ceiling (default 64)
      # skew_metrics   = true              # log per-partition row counts

      # --- Tuning, resilience, diagnostics -----------------------------------
      fetchsize = 5000                     # JDBC fetch size (default 1000)

      retry {
        max_attempts = 3
        backoff_ms   = 2000
      }

      health_check {
        enabled         = true             # default true: validation query pre-read
        # executor_probe   = true          # also probe connectivity from executors
        # probe_partitions = 2             # executor probe fan-out (default 2)
      }

      diagnostics {
        log_sql = false                    # log rendered SQL (never credentials)
      }

      # Free-form parameters exposed to downstream pipeline stages
      # pipeline_parameters { region_scope = "midwest" }
    }

    # =========================================================================
    # WATERMARK ADVANCE POLICY (feed level)
    # =========================================================================
    # When the watermark commits: after CURATED publish (default) or after
    # RAW for intentionally raw-only feeds (no curated block / disabled).
    watermark {
      advance_after = "CURATED"            # CURATED (default) | RAW
    }

    # =========================================================================
    # AUDIT, CONCURRENCY (same shape as the file reference)
    # =========================================================================
    audit {
      database           = "ingest_audit"
      control_total_expr = "count(*)"
      reconciliation { on_mismatch = "WARN" }   # WARN | FAIL
    }

    concurrency {
      lock          = "REQUIRED"           # REQUIRED (default) | OFF
      database      = "ingest_audit"
      table         = "ingest_run_locks"
      lease_minutes = 240
      settle_ms     = 2000
      # wait_ms     = 0                    # 0 = fail fast on a held entity
                                           # (default); >0 = retry until the
                                           # budget is spent
    }

    # =========================================================================
    # RAW — append-only landing table
    # =========================================================================
    raw {
      database = "claims_raw"
      table    = "claims_jdbc_feed"
      path     = "hdfs:///data/warehouse/claims/raw/claims_jdbc_feed"
      format   = "orc"

      # Extended per-record source lineage: source_modified_ts (copy of the
      # designated freshness column), source_operation (soft-delete indicator
      # -> 'D', else 'I'), source_primary_key (business-key concat); JDBC
      # rows carry file_id = null instead of a constant hash.
      # lineage_extended       = true
      # source_modified_column = "modified_ts"   # default: contract incremental
                                                 # column, then watermark column

      # record_hash canonicalization (changes every hash — the recipe version
      # recorded as table property ingest.record_hash.version makes the
      # change detectable, never silent):
      # record_hash_options { trim = false, uppercase = false }

      # Delivery mode: AT_LEAST_ONCE_APPEND (default; overlap rereads and
      # drifted retries duplicate in RAW, curated dedups) or
      # DEDUPLICATED_APPEND (anti-join on the source record-version identity
      # below; the skipped overlap is measured as raw_overlap_reread).
      # delivery_mode   = "AT_LEAST_ONCE_APPEND"
      # idempotency_key = ["claim_id", "modified_ts"]  # source PK + version,
                                                       # never run_id (CFG_013)

      partitioning {
        keys = ["ingest_dt"]
        derive {
          ingest_dt {
            kind = "expr"
            expr = "date_format(current_timestamp(), 'yyyy-MM-dd')"
          }
        }
      }
    }

    # =========================================================================
    # CURATED — keyed upsert-union-dedup merge (mode = INCR)
    # =========================================================================
    curated {
      enabled  = true
      database = "claims_curated"
      table    = "claims_jdbc_feed"
      path     = "hdfs:///data/warehouse/claims/curated/claims_jdbc_feed"
      format   = "orc"

      column_types {
        claim_id = "string"
        amount   = "decimal(18,2)"
      }

      transform {
        derive = [
          { name = "create_timestamp", expr = "current_timestamp()" }
        ]
      }

      merge {
        keys = ["claim_id"]
        null_handling {
          drop_null_keys      = true       # legacy boolean (QUARANTINE/ALLOW)
          treat_blank_as_null = true
          # policy = "QUARANTINE"          # QUARANTINE | ALLOW | FAIL_RUN
        }                                  # (policy wins over drop_null_keys)
        freshness {
          column       = "modified_ts"     # source freshness decides the winner
                                           # (always highest-wins)
          tie_breakers = ["claim_id"]      # each entry may declare direction:
                                           # "seq asc nulls_first"; default
                                           # desc nulls_last
        }
        # require_ordering = true          # refuse the nondeterministic
                                           # dedup fallback outright (CUR_004)

        # Delete strategy (explicit; undeclared logs an IGNORE default):
        #   IGNORE                 source deletions not reflected (audited)
        #   SOFT                   indicator column marks tombstones
        #   FULL_SNAPSHOT_ABSENCE  FULL publishes tombstone keys absent from
        #                          a COMPLETE snapshot; requires
        #                          confirm_complete_extract=true and no
        #                          source-side filtering (CFG_014)
        #   CHANGE_TRACKING | CDC  declared capabilities, not implemented
        # deletes {
        #   mode             = "SOFT"
        #   indicator_column = "is_deleted"
        #   indicator_values = ["true", "1", "y", "d"]
        #   # confirm_complete_extract = true   # FULL_SNAPSHOT_ABSENCE only
        # }
      }

      dedup {
        order_by = ["modified_ts"]
      }

      publish {
        allow_empty         = false
        enforce_unique_keys = true
        max_shrink_percent  = 20.0         # incremental default guards shrink too
        # validation_query  = "SELECT count(*) FROM {table} WHERE claim_id IS NULL"
      }
    }
  }
}
