# SmartIQ_PDP END-TO-END TEST FEED (lower environment)
# Same machinery as the production feed, 11 columns instead of 364 and its
# own entity/tables so it can run beside the real feed without touching it.
# Entity name differs => its own watermark row, its own ledger history, its
# own lock. Nothing here is shared with production except the databases.
# ---------------------------------------------------------------------------
# CONNECTION DETAILS — the one place to set MS SQL host / database / table.
# Each key has a default and an optional environment override, so ONE file
# serves lower and production: set the variable in the DRIVER's environment
# and the value wins; leave it unset and the default applies.
#
# CLUSTER MODE: these are read from the driver JVM's environment, and with
# --deploy-mode cluster the driver is a YARN container — a plain `export`
# in the submitting shell does NOT reach it. Forward each one:
#
#   --conf spark.yarn.appMasterEnv.SMARTIQ_HOST="$SMARTIQ_HOST"
#   --conf spark.yarn.appMasterEnv.SMARTIQ_DB="$SMARTIQ_DB"
#   --conf spark.yarn.appMasterEnv.SMARTIQ_TABLE="$SMARTIQ_TABLE"
#   --conf spark.yarn.appMasterEnv.SMARTIQ_DB_PASSWORD="$SMARTIQ_DB_PASSWORD"
#
# (or list the names in INGEST_ENV_VARS and use scripts/run_ingest.sh, or
# run --deploy-mode client where a plain `export` does work).
#
# ASYMMETRIC FAILURE: an unforwarded SMARTIQ_DB_PASSWORD kills the run with
# JDBC_002, but an unforwarded HOST/DB/TABLE/USER/PORT silently falls back
# to the default below — no error, wrong database. Check the driver's
# `[Jdbc] url=... table=...` log line against what you intended.
#
# NOTE: with --conf-path the framework resolves substitutions against
# ENVIRONMENT VARIABLES only — `-D` system properties are NOT consulted on
# that path (verified; see EnvSubstTest). Use env vars, not -D.
# ---------------------------------------------------------------------------
sqlserver {
  host     = "UNSET-export-SMARTIQ_HOST"
  host     = ${?SMARTIQ_HOST}
  port     = "1433"
  port     = ${?SMARTIQ_PORT}
  database = "SmartIQ"
  database = ${?SMARTIQ_DB}
  table    = "dbo.SmartIQ_PDP_E2E"
  table    = ${?SMARTIQ_TABLE}
  user     = "svc_ingest"
  user     = ${?SMARTIQ_USER}
}

feeds {
  smartiq_pdp_e2e {
    entity = "smartiq_pdp_e2e"
    mode = "INCR"

    include required("smartiq-pdp-e2e-schema.conf")

    source {
      type = "jdbc"
      url = "jdbc:sqlserver://"${sqlserver.host}":"${sqlserver.port}";databaseName="${sqlserver.database}
      table = ${sqlserver.table}
      auth {
        user = ${sqlserver.user}
        password = { provider = "env", key = "SMARTIQ_DB_PASSWORD" }
      }
      mode = "INCREMENTAL"
      incremental {
        watermark_type = "TIMESTAMP"
        watermark_columns = ["LastModifiedDatetime"]
        initial_value = "1900-01-01 00:00:00"
        overlap = "300"
        clock_zone = "UTC"
        watermark_store { type = "hive", database = "membership_common_raw" }
      }
      # TLS: the sqlserver dialect defaults to encrypt=true and
      # trustServerCertificate=false, so the server's certificate must chain
      # to a CA the JVM trusts. If the handshake fails with
      #   "PKIX path building failed ... unable to find valid certification
      #    path to requested target"
      # the corporate CA is missing from the truststore.
      #
      # PREFERRED FIX (no config change): import the issuing CA into the JVM
      # truststore on the driver AND every executor, e.g.
      #   keytool -importcert -alias corp-ca -file corp-ca.crt \
      #     -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit
      # Encryption and certificate validation both stay on.
      #
      # LOWER-ENVIRONMENT ESCAPE HATCH: skip certificate validation. The
      # connection is still encrypted, but it can no longer detect a
      # man-in-the-middle, so the service-account credential is exposed to
      # anyone who can intercept the connection. The framework refuses this
      # unless allow_insecure_tls is also set, and logs it loudly every run.
      # Uncomment BOTH lines, and never carry them into production.
      #
      # ENABLED 2026-08-09 by operator decision, pending the CA import.
      # Encryption stays ON; only certificate VALIDATION is skipped, so a
      # man-in-the-middle on the path to SQL Server would not be detected
      # and the svc_ingest credential is exposed to anyone who can intercept
      # it. Remove both lines once the internal CA is in the JVM truststore.
      allow_insecure_tls = true
      connection_properties { trustServerCertificate = "true" }

      health_check {
        enabled = true
        # Firewall validation: proves EXECUTORS can reach SQL Server, not
        # just the driver. Set probe_partitions above your executor count
        # so the tasks scatter across hosts.
        executor_probe = true
        probe_partitions = 4
      }
    }

    raw {
      database = membership_common_raw
      table = order_capture_smartiq_pdp_e2e
      record_hash = true
      lineage_extended = true
      partitioning {
        keys = ["ingest_dt"]
        # Named ingest_dt, not an arbitrary label: the framework keys RAW
        # retention partition-drops and --resume-ingest-dt replay off this
        # exact name. Any other name silently disables both.
        derive { ingest_dt = "date_format(current_timestamp(), 'yyyy-MM-dd')" }
      }
    }

    curated {
      database = membership_common_curated
      table = order_capture_pdp_forms_e2e
      format = orc
      merge {
        keys = ["file_name"]
        # Composite-key variant (scenario 8 in the test plan):
        # keys = ["group_number", "ai_groupand_ba_numbers_section_number"]
        freshness { column = "last_modified_datetime", compare_as = "timestamp" }
        deletes { mode = "IGNORE" }
      }
    }

    # CONTROL TABLES. They live in membership_common_raw because this site
    # cannot create databases; the framework only ever issues CREATE TABLE
    # IF NOT EXISTS here (CREATE DATABASE is skipped when the database
    # already exists), so no elevated privilege is needed.
    #
    # The database is SHARED with other pipelines, so every name is stated
    # explicitly rather than left to a default — what the framework creates
    # should be visible in the config, not implied. Rename freely if any of
    # these collide with an existing table; only these keys decide.
    # INDEPENDENT SOURCE COMPARISON (--stage reconcile, separate schedule).
    # Every other check is a within-run identity, so a batch lost OUTSIDE a
    # run — a dropped partition, a schedule that never fired, a manual edit —
    # leaves the ledger clean and the consumer as the detector.
    #
    # For THIS feed it earns its keep twice over: curated_keys_absent_from_source
    # is the measurement that tests the deletes { mode = "IGNORE" } assumption
    # above ("form store: no source deletes expected"). If that count is ever
    # non-zero, source deletes DO happen and the policy needs revisiting.
    #
    # REPORT, not FAIL: there is no batch to stop, and a nightly comparison
    # that goes red gets silenced rather than read. Findings land in
    # ingest_reconciliation and alert through the usual channel.
    #
    # Run it OFF-PEAK — it issues a COUNT(*) and a key-only projection
    # against SQL Server. Only file_name leaves the source, not 364 columns.
    reconcile {
      enabled     = true
      on_mismatch = "REPORT"
    }

    rejects {
      enabled = true
      database = membership_common_raw
      table = ingest_rejects
      payload = "MASKED"    # user_email_id is PII-tagged -> hashed in payloads

      # CEILING ON SILENT LOSS. Both thresholds are OPTIONAL in the
      # framework, and unset means UNBOUNDED — this feed could reject every
      # row and still report SUCCESS, with curated simply not advancing and
      # nobody alerted. Observed normal for this feed is ZERO rejects, so a
      # 1% ceiling tolerates a handful of genuinely bad records while a
      # systemic break (a source type change nulling required columns)
      # trips it immediately. The count is the small-batch guard: 1% of a
      # 20-row window is 0.2 rows, so percent alone would never fire.
      #
      # Rejected rows still land in ingest_rejects BELOW the ceiling —
      # review them; the threshold is the alarm, not the acceptance test.
      max_reject_percent = 1.0
      max_reject_count   = 100
    }
    audit {
      database = membership_common_raw
      run_table            = ingest_run_audit
      file_table           = ingest_file_audit
      reconciliation_table = ingest_reconciliation
      header_table         = ingest_header_audit

      # VOLUME FLOOR — DECISION REQUIRED, deliberately left off.
      #
      # Every other reconciliation check is an identity and passes TRIVIALLY
      # on an empty batch (0 = 0 + 0), so a run that extracted nothing looks
      # perfectly healthy and the consumer notices first. A floor turns that
      # into a reconciliation failure:
      #
      #   min_accepted_rows = 1
      #
      # Not enabled here because whether ZERO rows is legitimate depends on
      # this feed's business rhythm, which the framework cannot know: if no
      # form is submitted over a weekend, an empty incremental window is
      # correct and a floor would page someone for nothing.
      #
      # HOW TO CHOOSE IT: watch a week of runs, then set it below the
      # quietest legitimate window.
      #   SELECT run_id, accepted_count, event_ts
      #   FROM   membership_common_raw.ingest_run_audit
      #   WHERE  entity = 'smartiq_pdp_e2e' AND stage = 'raw' AND status = 'SUCCESS'
      #   ORDER  BY event_ts DESC LIMIT 20;
      # If the minimum is never 0, set the floor to 1 — that alone catches
      # the outage, watermark-overrun and renamed-table cases.
      # min_accepted_rows = 1
    }
    # Entity lock; defaults to audit.database when concurrency.database is
    # unset, so it lands in membership_common_raw too.
    # Entity lock. lease_minutes is the time a CRASHED run blocks the
    # entity, NOT how long a run may take: the heartbeat re-claims every
    # lease/3, so a healthy run holds the lock indefinitely. The 240-minute
    # default predates that heartbeat and left a killed run wedging the
    # entity for four hours. 30 clears it in 30 minutes and makes the
    # alive-vs-crashed verdict decisive in ~20 rather than ~160.
    # Do not go far below 10: the heartbeat abandons ownership on the FIRST
    # failed renewal, so a transient metastore stall would abort a healthy
    # run.
    concurrency {
      table = ingest_run_locks
      lease_minutes = 30
    }

    # FAILURE ALERTING. Absent, the framework detects failures precisely and
    # tells nobody — a Control-M failure is visible only to whoever queries
    # the ledger. Every terminal failure (stage failure, reconciliation
    # mismatch, lock contention) reaches the sinks below.
    #
    # Delivery is best-effort by design: an unreachable webhook, an HTTP
    # error or a hanging command is logged and swallowed, because a pipeline
    # must never fail — or appear to fail — because alerting failed.
    # Messages are redacted through the audit sanitizer first; a webhook is
    # a wider audience than a log file.
    #
    # SET THE URL BELOW before relying on this. Until then the block is
    # inert and every failure is logged locally only.
    notifications {
      enabled = true
      on      = ["FAILURE"]     # add "SUCCESS" only if you truly want one per run
      webhook {
        url        = "REPLACE-WITH-YOUR-WEBHOOK-URL"
        url        = ${?SMARTIQ_ALERT_WEBHOOK}
        timeout_ms = 5000
      }
      # command = "/opt/ingest/notify.sh"   # argv: outcome entity run_id stage message
    }
  }
}
