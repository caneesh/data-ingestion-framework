# SmartIQ_PDP E2E (lower environment) — 11-column representative subset of
# the 364-column production contract. Every column earns its place by
# exercising a distinct mechanism (noted above each entry), so a green run
# here means the same machinery the full feed depends on is working.
# Names, aliases, types, transforms and PII tags are copied VERBATIM from
# hive_raw_curated_mapping_v2_all_columns.xlsx — this is a subset, not a
# variant.
schema {
  version = "2.0-e2e"
  compatibility = "BACKWARD"
  on_extra_column = "WARN"
  columns = [
    # business key
    { name = "file_name", type = "string", aliases = ["FileName"], business_key = true, nullable = false, transform = "nullif(trim({col}), '')" },
    # freshness + watermark (datetime)
    { name = "last_modified_datetime", type = "timestamp", aliases = ["LastModifiedDatetime"], required = false, incremental = true },
    # column restored in v2
    { name = "form_guid", type = "string", aliases = ["FormGuid"], required = false, transform = "nullif(trim({col}), '')" },
    # PII masking in rejects
    { name = "user_email_id", type = "string", aliases = ["UserEmailId"], required = false, transform = "nullif(trim({col}), '')", sensitivity = "PII" },
    # date-typed source column
    { name = "effective_date", type = "date", aliases = ["EffectiveDate"], required = false },
    # composite-key alternative (part 1)
    { name = "group_number", type = "string", aliases = ["GroupNumber"], required = false, transform = "nullif(trim({col}), '')" },
    # composite-key alternative (part 2)
    { name = "ai_groupand_ba_numbers_section_number", type = "string", aliases = ["AIGroupandBANumbers.SectionNumber"], required = false, transform = "nullif(trim({col}), '')" },
    # source name with special chars -> alias
    { name = "ai_size_contract_count", type = "string", aliases = ["AISize/ContractCount"], required = false, transform = "nullif(trim({col}), '')" },
    # plain varchar: trim/empty -> NULL
    { name = "funding_type", type = "string", aliases = ["FundingType"], required = false, transform = "nullif(trim({col}), '')" },
    # collision pair (base)
    { name = "mds_retail_max_day_supply", type = "string", aliases = ["MDS.RetailMaximumDaySupply"], required = false, transform = "nullif(trim({col}), '')" },
    # collision pair (renamed *_incl_esn)
    { name = "mds_retail_max_day_supply_incl_esn", type = "string", aliases = ["MDSRetailMaximumDaySupply"], required = false, transform = "nullif(trim({col}), '')" }
  ]
}
