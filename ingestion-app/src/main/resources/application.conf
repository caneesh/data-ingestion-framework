app {
  spark {
    appName = "DataIngestionFramework"
    master = "yarn"
  }
}

feeds {
  # Example: File-based ingestion (CSV)
  health_sherpa_member {
    entity = "health_sherpa_member"
    mode = "FULL"

    source {
      type = "file"
      path = "hdfs:///data/incoming/membership/health_sherpa/*.csv"
      file_type = "csv"
      header = true
      delimiter = ","
      quote = "\""
      escape = "\\"
      multiline = false
      drop_trailer = false

      columns = ["subscriber_id", "hios_id"]

      header_aliases {
        "subscriber id" = "subscriber_id"
        "subscriberid" = "subscriber_id"
        "member subscriber id" = "subscriber_id"
        "hios id" = "hios_id"
        "hiosid" = "hios_id"
        "plan_hios_id" = "hios_id"
        "plan hios id" = "hios_id"
      }

      force_columns_by_position = true
    }

    raw {
      database = "membership_raw"
      table = "health_sherpa_member"
      path = "hdfs:///data/warehouse/membership/raw/health_sherpa_member"
      format = "orc"

      partitioning {
        keys = ["ingest_dt"]
        derive {
          ingest_dt {
            kind = "expr"
            expr = "date_format(current_timestamp(), 'yyyy-MM-dd')"
          }
        }
      }
    }

    curated {
      enabled = true
      database = "membership_curated"
      table = "health_sherpa_member"
      path = "hdfs:///data/warehouse/membership/curated/health_sherpa_member"
      format = "orc"

      column_types {
        subscriber_id = "string"
        hios_id = "string"
      }

      transform {
        derive = [
          { name = "create_timestamp", expr = "current_timestamp()" }
        ]
      }

      merge {
        keys = []
      }
    }
  }

