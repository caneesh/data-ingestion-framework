app {
  spark {
    appName = "DataIngestionFramework"
    master = "yarn"
  }
}

feeds {
  # Example: File-based ingestion (CSV) with a schema contract
  health_sherpa_member {
    entity = "health_sherpa_member"
    mode = "FULL"

    # Formal schema contract for the feed. Headers are matched by name or
    # alias; every drift (missing/extra/renamed/reordered/duplicate columns,
    # type changes, nullability violations, version mismatches) is detected
    # and handled per the policies below (FAIL | WARN | IGNORE).
    schema {
      version = "1.0"
      compatibility = "BACKWARD"

      on_missing_column        = "FAIL"
      on_extra_column          = "WARN"
      on_type_change           = "FAIL"
      on_order_change          = "WARN"
      on_duplicate_header      = "FAIL"
      on_nullability_violation = "FAIL"
      on_version_mismatch      = "WARN"

      columns = [
        {
          name = "subscriber_id"       # canonical name: the ONLY name that
          type = "string"              # flows into RAW/CURATED tables
          nullable = false
          required = true
          aliases = ["subscriber id", "subscriberid", "member subscriber id"]
          position = 0
        },
        {
          # Health Sherpa example: vendor renamed "HIOS ID" to "Plan HIOS ID";
          # normalization + aliases map it back to the canonical hios_id.
          name = "hios_id"
          type = "string"
          nullable = false
          required = true
          aliases = ["plan_hios_id", "hios id", "hiosid", "plan hios id"]
          position = 1
          regex = "^[0-9]{5}[A-Z][0-9]{4}$"   # content rule: detects swapped columns
        },
        {
          name = "middle_name"
          type = "string"
          required = false             # optional: missing column gets the default
          default = null
          position = 2
        }
      ]

      # --- Header matching strategy -----------------------------------------
      # STRICT_NAME                  canonical names only, aliases ignored
      # NAME_WITH_ALIASES (default)  canonical names + approved aliases
      # NAME_ALIAS_POSITION_FALLBACK names/aliases first, then guarded
      #                              positional fallback (stable-order vendors only)
      header_validation {
        strategy = "NAME_WITH_ALIASES"
        on_missing_required = "FAIL"      # never silently null-fill a rename
        on_missing_optional = "ADD_DEFAULT"
        on_extra_columns = "WARN"
        on_duplicate_columns = "FAIL"
        quarantine_on_failure = true      # move staged files to quarantine

        # positional_fallback {            # only with NAME_ALIAS_POSITION_FALLBACK
        #   enabled = true
        #   require_exact_column_count = true
        #   require_content_validation = true
        # }
      }

      # --- Column content validation (detects swapped/mismapped columns) ---
      content_validation {
        enabled = true
        mode = "SAMPLE"                   # SAMPLE | FULL
        sample_rows = 1000
        maximum_failure_percentage = 0.0
      }
    }

    source {
      type = "file"
      path = "hdfs:///data/incoming/membership/health_sherpa/*.csv"
      file_type = "csv"
      header = true
      delimiter = ","
      quote = "\""
      escape = "\\"
      multiline = false
      drop_trailer = false

      # Positional recovery is opt-in with a schema contract: headers are
      # still validated first so drift is surfaced before mapping by position.
      # force_columns_by_position = true

      # Legacy per-source options (columns / header_aliases) still work for
      # feeds without a schema contract.

      # --- Managed file lifecycle (replaces static `path`) -------------------
      # When folders are configured, files flow landing -> inprogress ->
      # processed (+ optional archive copy); invalid files -> quarantine.
      # folders {
      #   landing    = "hdfs:///data/membership/health_sherpa/landing"
      #   inprogress = "hdfs:///data/membership/health_sherpa/inprogress"
      #   processed  = "hdfs:///data/membership/health_sherpa/processed"
      #   archive    = "hdfs:///data/membership/health_sherpa/archive"
      #   quarantine = "hdfs:///data/membership/health_sherpa/quarantine"
      # }

      # --- Pre-read file validation (quarantines with reason on failure) ----
      # validation {
      #   filename_pattern   = "member_.*[.]csv"
      #   allowed_extensions = ["csv"]
      #   encoding           = "UTF-8"
      #   min_size_bytes     = 1
      #   max_size_bytes     = 1073741824
      #   delimiter          = ","
      #   checksum { sidecar_suffix = ".sha256", required = false, algorithm = "SHA-256" }
      #   header   { expected_columns = 2, expected_names = ["subscriber id", "plan_hios_id"] }
      #   trailer  { required = false, marker = "TRL" }
      # }
    }

    # --- Content-based idempotency (SHA-256 file registry) -------------------
    # idempotency {
    #   database         = "ingest_audit"
    #   registry_table   = "ingest_file_registry"
    #   duplicate_policy = "SKIP"   # SKIP | REJECT | REPROCESS_WITH_APPROVAL
    # }

    # --- Record-level reject handling ----------------------------------------
    # rejects {
    #   database = "ingest_audit"
    #   table    = "ingest_rejects"
    #   use_contract_nullability = true   # derive rules from the schema contract
    #   rules = [
    #     { name = "missing_subscriber",
    #       condition = "subscriber_id IS NULL OR trim(subscriber_id) = ''",
    #       error_code = "R001", category = "MISSING_KEY",
    #       message = "subscriber_id is required" }
    #   ]
    #   max_reject_count   = 1000
    #   max_reject_percent = 5.0
    # }

    # --- Audit and reconciliation --------------------------------------------
    # audit {
    #   database           = "ingest_audit"
    #   control_total_expr = "count(*)"
    #   reconciliation { on_mismatch = "WARN" }   # WARN | FAIL
    # }

    raw {
      database = "membership_raw"
      table = "health_sherpa_member"
      path = "hdfs:///data/warehouse/membership/raw/health_sherpa_member"
      format = "orc"

      partitioning {
        keys = ["ingest_dt"]
        derive {
          ingest_dt {
            kind = "expr"
            expr = "date_format(current_timestamp(), 'yyyy-MM-dd')"
          }
        }
      }
    }

    curated {
      enabled = true
      database = "membership_curated"
      table = "health_sherpa_member"
      path = "hdfs:///data/warehouse/membership/curated/health_sherpa_member"
      format = "orc"

      column_types {
        subscriber_id = "string"
        hios_id = "string"
      }

      transform {
        derive = [
          { name = "create_timestamp", expr = "current_timestamp()" }
        ]
      }

      merge {
        keys = []
      }
    }
  }

